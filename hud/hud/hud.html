<!DOCTYPE html>
<html>
<link rel="stylesheet" href="assets/cef.css">
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD</title>
    <link rel="stylesheet" type="text/css" href="assets/cef.css">
    <script src="assets/hud.js"></script>
</head>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
    <div class="hud">
        <div class="server-header" id="server-header">
            <div class="server-logo">
                <img src="assets/ftl.png" id="logo_server" alt="Server Logo">
            </div>
            <div class="server-info">
                <div class="server-name" id="name_server">ing</div>
                <div class="server-subtitle">
                    <img src="assets/fire.png" class="status-icon" id="serv_icon" alt="">
                    <span id="serv_name">First Server</span>
                </div>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-bar">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="#ef4444">
                        <path d="M320.2 243.8l-49.7 99.4c-6 12.1-23.4 11.7-28.9-.6l-56.9-126.3-30 71.7H60.6l182.5 186.5c7.1 7.3 18.6 7.3 25.7 0L451.4 288H342.3l-22.1-44.2zM473.7 73.9l-2.4-2.5c-51.5-52.6-135.8-52.6-187.4 0L256 100l-27.9-28.5c-51.5-52.7-135.9-52.7-187.4 0l-2.4 2.4C-10.4 123.7-12.5 203 31 256h102.4l35.9-86.2c5.4-12.9 23.6-13.2 29.4-.4l58.2 129.3 49-97.9c5.9-11.8 22.7-11.8 28.6 0l27.6 55.2H481c43.5-53 41.4-132.3-7.3-182.1z"/>
                    </svg>
                </div>
                <div class="progress-container">
                    <div class="progress-bg">
                        <div class="progress-fill health-fill" id="hp_bar" style="width: 80%;"></div>
                    </div>
                </div>
            </div>

            <div class="stat-bar">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="#3b82f6">
                        <path d="M466.5 83.7l-192-80a48.2 48.2 0 0 0 -36.9 0l-192 80C27.7 91.1 16 108.6 16 128c0 198.5 114.5 335.7 221.5 380.3 11.8 4.9 25.1 4.9 36.9 0C360.1 472.6 496 349.3 496 128c0-19.4-11.7-36.9-29.5-44.3zM256.1 446.3l-.1-381 175.9 73.3c-3.3 151.4-82.1 261.1-175.8 307.7z"/>
                    </svg>
                </div>
                <div class="progress-container">
                    <div class="progress-bg">
                        <div class="progress-fill armor-fill" id="arm_bar" style="width: 60%;"></div>
                    </div>
                </div>
            </div>

            <div class="stat-bar" id="oxygen-bar-container" style="display: none;">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="#06b6d4">
                        <path d="M133.437 51.361C90.937 189.281 0 226.906 0 324.141C0 410.219 71.562 480 159.999 480S319.999 410.219 319.999 324.141C319.999 226.359 229.27 190.047 186.562 51.361C179.374 26.096 141.562 25.002 133.437 51.361Z"/>
                    </svg>
                </div>
                <div class="progress-container">
                    <div class="progress-bg">
                        <div class="progress-fill oxygen-fill" id="oxy_bar" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div class="stat-bar">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="#22c55e">
                        <path d="M296 160H180.6l42.6-129.8C227.2 15 215.7 0 200 0H56C44 0 33.8 8.9 32.2 20.8l-32 240C-1.7 275.2 9.5 288 24 288h118.7L96.6 482.5c-3.6 15.2 8 29.5 23.3 29.5 8.4 0 16.4-4.4 20.8-12l176-304c9.3-15.9-2.2-36-20.7-36z"/>
                    </svg>
                </div>
                <div class="progress-container">
                    <div class="progress-bg">
                        <div class="progress-fill stamina-fill" id="stam_bar" style="width: 90%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="weapon-display">
            <div class="weapon-icon-container">
                <img src="assets/weapons/0.png" class="weapon-icon" id="bullets" alt="Weapon">
            </div>
            <div class="ammo-count" id="bc_wpc">999</div>
        </div>

        <div class="currency-container">
            <div class="currency-item money" id="money_count">$ 1,000,000</div>
            <div class="currency-item reputation" id="rep_count" style="display: none;">R 1,000,000</div>
        </div>
    </div>

    <div class="premium-badge" id="prem">LAUNCHER</div>

    <div class="speedometer-container" id="speedbody">
        <div class="speedometer">
            <div class="speedo-circle">
                <div class="glow-effect"></div>
                <div class="inner-ring"></div>
                <div class="speedo-marks" id="speedMarks"></div>
                
                <div class="speed-display">
                    <div class="speed-value" id="speed">0</div>
                    <div class="speed-unit">km/h</div>
                </div>
                
                <div class="speedo-needle" id="rpm"></div>
                <div class="speedo-center"></div>
            </div>
        </div>

        <div class="vehicle-controls">
            <div class="vehicle-indicator" id="vehleft">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                    <path d="M448 224V288C448 305.674 433.674 320 416 320H224V416C224 428.938 216.203 440.609 204.25 445.562C192.281 450.516 178.531 447.781 169.375 438.625L9.375 278.625C3.125 272.375 0 264.188 0 256S3.125 239.625 9.375 233.375L169.375 73.375C178.531 64.219 192.281 61.484 204.25 66.438C216.203 71.391 224 83.062 224 96V192H416C433.674 192 448 206.328 448 224Z"/>
                </svg>
            </div>
            <div class="vehicle-indicator" id="vehlock">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <path d="M466.5 83.68L274.5 3.672C269.625 1.641 261.344 0 256.062 0C250.75 0 242.5 1.641 237.594 3.672L45.594 83.68C27.688 91.07 16 108.574 16 127.984C16 385.157 205.164 512 255.953 512C307.975 512 496 383.813 496 127.984C496 108.574 484.312 91.07 466.5 83.68ZM280 258.406V328C280 341.25 269.25 352 256 352S232 341.25 232 328V258.406C213.133 249.398 200 230.301 200 208C200 177.07 225.072 152 256 152S312 177.07 312 208C312 230.301 298.867 249.398 280 258.406Z"/>
                </svg>
            </div>
            <div class="vehicle-indicator" id="veheng">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path d="M144 128C144 110.3 158.3 96 176 96L240 96C257.7 96 272 110.3 272 128L368 128C368 110.3 382.3 96 400 96L464 96C481.7 96 496 110.3 496 128L512 128C547.3 128 576 156.7 576 192L576 448C576 483.3 547.3 512 512 512L128 512C92.7 512 64 483.3 64 448L64 192C64 156.7 92.7 128 128 128L144 128zM456 248C456 234.7 445.3 224 432 224C418.7 224 408 234.7 408 248L408 280L376 280C362.7 280 352 290.7 352 304C352 317.3 362.7 328 376 328L408 328L408 360C408 373.3 418.7 384 432 384C445.3 384 456 373.3 456 360L456 328L488 328C501.3 328 512 317.3 512 304C512 290.7 501.3 280 488 280L456 280L456 248zM128 304C128 317.3 138.7 328 152 328L264 328C277.3 328 288 317.3 288 304C288 290.7 277.3 280 264 280L152 280C138.7 280 128 290.7 128 304z"/>
                </svg>
            </div>
            <div class="vehicle-indicator" id="vehright">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                    <path d="M448 256C448 264.188 444.875 272.375 438.625 278.625L278.625 438.625C269.469 447.781 255.719 450.516 243.75 445.562C231.797 440.609 224 428.938 224 416V320H32C14.326 320 0 305.672 0 288V224C0 206.326 14.326 192 32 192H224V96C224 83.062 231.797 71.391 243.75 66.438C255.719 61.484 269.469 64.219 278.625 73.375L438.625 233.375C444.875 239.625 448 247.812 448 256Z"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="clock-container">
        <div class="clock-time" id="time">15:37:21
16:37:21
04.06.2025</div>
    </div>

    <div class="notification" id="notf_1">
        <div class="notification-icon info" id="notf-icon">
            <img src="assets/info.png" id="notf_img" alt="Icon">
        </div>
        <div class="notification-content">
            <div class="notification-title" id="notf_head">Информация</div>
            <div class="notification-text" id="notf_body">Добро пожаловать на сервер!</div>
        </div>
    </div>

</body>

</html>
